server {
  listen 8080;
  server_name localhost;

  root   /usr/share/nginx/html;

  location / {
    proxy_hide_header Access-Control-Allow-Origin;
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header Content-Type text/plain;
    return 200 'Hello, I am customer CDN!';
  }

  location /health {
    add_header Content-Type text/plain;
    return 200 'healthyz-KLPROD';
  }

  location /create-customer/ {
    proxy_hide_header Access-Control-Allow-Origin;
    add_header 'Access-Control-Allow-Origin' '*' always;
  }

  location /create-super/ {
    proxy_hide_header Access-Control-Allow-Origin;
    add_header 'Access-Control-Allow-Origin' '*' always;
  }

  location /edit-customer/ {
    proxy_hide_header Access-Control-Allow-Origin;
    add_header 'Access-Control-Allow-Origin' '*' always;
  }

   location /edit-multiple-customers/ {
    proxy_hide_header Access-Control-Allow-Origin;
    add_header 'Access-Control-Allow-Origin' '*' always;
  }

  location /sportsbook-information/ {
     proxy_hide_header Access-Control-Allow-Origin;
     add_header 'Access-Control-Allow-Origin' '*' always;
   }

  location /direct-member/create/ {
    proxy_hide_header Access-Control-Allow-Origin;
    add_header 'Access-Control-Allow-Origin' '*' always;
  }

  location /cash-member/create/ {
    proxy_hide_header Access-Control-Allow-Origin;
    add_header 'Access-Control-Allow-Origin' '*' always;
  }

  location /cash-member/edit-info/ {
    proxy_hide_header Access-Control-Allow-Origin;
    add_header 'Access-Control-Allow-Origin' '*' always;
  }
}
